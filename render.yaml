# One-click deploy: https://render.com/deploy?repo=https://github.com/divyavenn/letter-to-saiyam
# Nothing to fill in: the composer's secret is generated for you.
services:
  - type: web
    name: letters
    runtime: node
    # The smallest paid instance; free instances can't keep a disk.
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    # Letters and photos live here, and survive deploys and restarts.
    # Render snapshots it daily.
    disk:
      name: letters
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_ROOT
        value: /var/data
      # The composer's secret address, /write/<path>, is derived from this and
      # printed in the deploy logs.
      - key: WRITE_SECRET
        generateValue: true
