<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // iOS zooms in on any focused text smaller than 16px, which the printed
      // date and stamps are. maximum-scale stops that; iOS still allows pinch
      // zoom, and other platforms keep the default so their zoom is untouched.
      if (/iP(hone|ad|od)/.test(navigator.platform) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name="viewport"]').content += ", maximum-scale=1";
      }
    </script>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Write a letter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/write/main.jsx"></script>
  </body>
</html>
